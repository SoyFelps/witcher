# Keeps both Witcher Supabase projects (free plan) from being auto-paused after a week without use.
# Once a day it calls a public, read-only database function that only returns 'ok'.
# Uses only the public (publishable) keys. If a project is paused or unreachable, the job fails and
# GitHub e-mails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: production (WitcherAPP)
            url: https://iwpmsfoovppqnldciric.supabase.co
            key: sb_publishable_6p9aVFFcA9Uc-nW9-MofsQ_EAyjZoh9
          - name: staging (WitcherAPP-staging)
            url: https://dvyeucfxwkibscooocby.supabase.co
            key: sb_publishable_8pqx9OAhZ2aXvQDTcepMXw_OK4A5cSN
    steps:
      - name: Call witcher_ping on ${{ matrix.name }}
        env:
          SUPABASE_URL: ${{ matrix.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 --output /tmp/response.json --write-out '%{http_code}' \
            --request POST "$SUPABASE_URL/rest/v1/rpc/witcher_ping" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}')
          echo "HTTP $status"
          cat /tmp/response.json; echo
          test "$status" = "200"
